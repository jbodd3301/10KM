
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Programme 10KM</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 1em;
      background-color: #f4f4f4;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .week {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      margin-bottom: 1em;
      padding: 1em;
    }
    .week h2 {
      color: #007BFF;
      margin: 0 0 0.5em 0;
    }
    .session {
      margin-bottom: 0.5em;
    }
    button {
      background-color: #007BFF;
      color: white;
      border: none;
      padding: 0.5em 1em;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    label {
      display: block;
      margin-top: 0.3em;
    }
    input[type="checkbox"] {
      margin-right: 0.5em;
    }
    .full-details {
      display: none;
      margin-top: 1em;
    }
    .full-details p {
      margin: 0.2em 0;
    }
  </style>
</head>
<body>
  <h1>Programme 10KM – 3 sorties/semaine</h1>

  <div id="program"></div>

  <script>
    const program = [
      ["4 km facile", "5 km avec 3x1' rapide (récup 2')", "6 km endurance"],
      ["4.5 km modéré", "5 km avec 4x1' rapide (récup 2')", "7 km endurance"],
      ["5 km constant", "6 km avec 4x1'30 rapide (récup 1'30)", "8 km endurance"],
      ["5 km avec 4x20'' accélérations", "6 km avec 5x1' rapide (récup 1'30)", "8 km facile"],
      ["5 km continu", "7 km avec 4x1'15 rapide (récup 1'30)", "9 km endurance"],
      ["6 km modéré", "7 km avec 5x1' rapide (récup 1'30)", "9 km régulier"],
      ["5 km à allure cible", "6 km tempo (4 km soutenu)", "10 km simulation"],
      ["5 km avec 3x30'' accélérations", "6 km avec 4x1' rapide (récup 1')", "8 km relax"],
      ["5 km léger avec accél.", "4 km alterné (500m rapide/lent)", "Course 10 km"]
    ];

    const detailsText = [
      `
      <p><strong>Mardi (4 km facile)</strong> :<br>4 km à allure confortable.</p>
      <p><strong>Jeudi (5 km avec intervalles)</strong> :<br>1 km d’échauffement<br>3 x 1 minute à allure légèrement plus rapide (effort contrôlé) avec 2 minutes de récupération (jogging léger)<br>Récupération pour compléter jusqu’à 5 km</p>
      <p><strong>Dimanche (6 km long)</strong> :<br>6 km à une allure très confortable pour travailler la constance.</p>
      `,
      "<p>Détails à venir</p>",
      "<p>Détails à venir</p>",
      "<p>Détails à venir</p>",
      "<p>Détails à venir</p>",
      "<p>Détails à venir</p>",
      "<p>Détails à venir</p>",
      "<p>Détails à venir</p>",
      "<p>Détails à venir</p>"
    ];

    const days = ["Mardi", "Jeudi", "Dimanche"];
    const container = document.getElementById("program");

    program.forEach((week, i) => {
      const weekDiv = document.createElement("div");
      weekDiv.className = "week";

      const title = document.createElement("h2");
      title.textContent = `Semaine ${i + 1}`;
      weekDiv.appendChild(title);

      week.forEach((session, j) => {
        const label = document.createElement("label");
        label.className = "session";
        label.innerHTML = `
          <input type="checkbox" />
          <strong>${days[j]}:</strong> ${session}
        `;
        weekDiv.appendChild(label);
      });

      const button = document.createElement("button");
      button.textContent = "Détail de la semaine";
      const fullDetails = document.createElement("div");
      fullDetails.className = "full-details";
      fullDetails.innerHTML = detailsText[i];

      button.addEventListener("click", () => {
        fullDetails.style.display = fullDetails.style.display === "none" ? "block" : "none";
      });

      weekDiv.appendChild(button);
      weekDiv.appendChild(fullDetails);
      container.appendChild(weekDiv);
    });
  </script>
</body>
</html>
